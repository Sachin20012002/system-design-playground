services:
  redis:
    image: redis:8
    container_name: rate-limiter-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limiter-app-1
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RATE_LIMIT_ALGORITHM: REDIS_TOKEN_BUCKET
      RATE_LIMIT_BUCKET_CAPACITY: 5
      RATE_LIMIT_BUCKET_REFILL_COUNT_PER_SECOND: 1
      RATE_LIMIT_MAX_REQUESTS: 5
      RATE_LIMIT_WINDOW_SECONDS: 10
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limiter-app-2
    environment:
      SERVER_PORT: 8081
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RATE_LIMIT_ALGORITHM: REDIS_TOKEN_BUCKET
      RATE_LIMIT_BUCKET_CAPACITY: 5
      RATE_LIMIT_BUCKET_REFILL_COUNT_PER_SECOND: 1
      RATE_LIMIT_MAX_REQUESTS: 5
      RATE_LIMIT_WINDOW_SECONDS: 10
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data: