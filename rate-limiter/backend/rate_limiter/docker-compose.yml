services:

  redis:
    image: redis:8

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5

  app1:
    build: .

    environment:
      SPRING_DATA_REDIS_HOST: redis
      RATE_LIMIT_ALGORITHM: REDIS_TOKEN_BUCKET

    depends_on:
      redis:
        condition: service_healthy

  app2:
    build: .

    environment:
      SPRING_DATA_REDIS_HOST: redis
      RATE_LIMIT_ALGORITHM: REDIS_TOKEN_BUCKET

    depends_on:
      redis:
        condition: service_healthy

  nginx:

    image: nginx:latest

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app1
      - app2

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - app1
      - app2

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  grafana-data:
